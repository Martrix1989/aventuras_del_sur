{% extends 'base.html' %}
{% block title %}Ingresar | Aventuras del Sur{% endblock %}
{% block content %}
<div class="login-wrap"><div class="login-card"><div class="login-mark"><i class="fas fa-mountain"></i></div><h2>Bienvenido</h2><p>Ingresa a Aventuras del Sur</p>
<form method="post">{% csrf_token %}{% if form.errors %}<div class="alert alert-danger">Usuario o contraseña incorrectos.</div>{% endif %}
<div class="form-group"><label for="id_username">Usuario</label><input class="form-control" type="text" name="username" id="id_username" required autofocus></div>
<div class="form-group"><label for="id_password">Contraseña</label><input class="form-control" type="password" name="password" id="id_password" required></div>
<button class="btn btn-primary btn-block" type="submit">Iniciar sesión</button><input type="hidden" name="next" value="{{ next }}"></form>
<a class="back-home" href="{% url 'core:home' %}">Volver al inicio</a></div></div>
{% endblock %}
